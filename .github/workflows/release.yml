name: Release build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_override:
        description: "Semver override to apply to all manifests for this run (blank uses package.json)"
        required: false
        type: string
      publish:
        description: "Publish draft-first release and update manifest"
        required: true
        type: boolean
        default: false
      targets:
        description: "Comma-separated targets: web,desktop-win,desktop-linux,android,ios or all"
        required: true
        type: string
        default: desktop-linux,android

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  web:
    name: web PWA bundle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then node scripts/version.mjs "${{ inputs.version_override }}"; fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Refuse duplicate version in release feed
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-version-not-released.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - run: npm run verify:pwa
      - run: npm run verify:packaging
      - run: npm run verify:branding
      - id: artifact
        run: node scripts/prepare-artifact.mjs --target pwa --input dist --signed true --why-not "PWA static bundle is integrity-covered by SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error

  cloudflare-pages:
    name: Cloudflare Pages PWA deployment
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (contains(inputs.targets, 'all') || contains(inputs.targets, 'web')))
    outputs:
      manifest_url: ${{ steps.deploy.outputs.manifest_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "::warning:: Cloudflare Pages deployment skipped: configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and CLOUDFLARE_PROJECT_NAME"
            echo "manifest_url=https://github.com/${{ github.repository }}/releases/download/v${{ needs.web.outputs.version }}/updates-manifest-${{ needs.web.outputs.version }}.json" >> "$GITHUB_OUTPUT"
            {
              echo "## Cloudflare Pages deployment skipped"
              echo "The PWA bundle was built, but Cloudflare credentials are not configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch main --commit-dirty=true
          node scripts/deploy-cloudflare-worker.mjs
          echo "manifest_url=https://yayra-updates-api.g2code335.workers.dev/updates/manifest.json" >> "$GITHUB_OUTPUT"

  desktop-linux:
    name: linux deb and AppImage
    runs-on: ubuntu-latest
    needs: web
    # Every push (including pushes to main) is a release build. Manual
    # dispatches can still select a narrower target set.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (contains(inputs.targets, 'all') || contains(inputs.targets, 'desktop-linux') || contains(inputs.targets, 'linux')))
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: if [ -n "${{ inputs.version_override }}" ]; then node scripts/version.mjs "${{ inputs.version_override }}"; fi
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - id: signing
        shell: bash
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          RELEASE_REQUIRES_SIGNING: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        run: |
          if [ -z "$LINUX_SIGNING_KEY" ]; then
            if [ "$RELEASE_REQUIRES_SIGNING" = "true" ]; then
              echo "::error:: Linux release signing requires LINUX_SIGNING_KEY before publishing"
              exit 1
            fi
            echo "::warning:: Linux signing skipped: LINUX_SIGNING_KEY is not configured; building unsigned .deb and .AppImage"
            {
              echo "## Signing skipped"
              echo "Linux: LINUX_SIGNING_KEY is absent, so the .deb and .AppImage are unsigned. Artifact name includes unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Inject Google sign-in config from repo secrets (optional)
        shell: bash
        env:
          YAYRA_GOOGLE_CLIENT_ID: ${{ secrets.YAYRA_GOOGLE_CLIENT_ID }}
          YAYRA_GOOGLE_CLIENT_SECRET: ${{ secrets.YAYRA_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$YAYRA_GOOGLE_CLIENT_ID" ] && [ -n "$YAYRA_GOOGLE_CLIENT_SECRET" ]; then
            node -e "require('fs').writeFileSync('electron/google-auth.config.json', JSON.stringify({ clientId: process.env.YAYRA_GOOGLE_CLIENT_ID.trim(), clientSecret: process.env.YAYRA_GOOGLE_CLIENT_SECRET.trim() }))"
            echo "Google sign-in config baked into this build."
          else
            echo "::warning:: YAYRA_GOOGLE_CLIENT_ID / YAYRA_GOOGLE_CLIENT_SECRET repo secrets not set - installed builds will show 'Google sign-in isn't configured' until users drop google-auth.config.json into their yayra config directory."
          fi
      - run: npm run package:linux
      - name: Smoke packaged Linux shell and PDF.js worker
        run: npm run smoke:desktop
      - run: npm run verify:packaging
      - name: Sign Linux packages and AppImage
        if: steps.signing.outputs.signed == 'true'
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_KEY_PASSWORD: ${{ secrets.LINUX_SIGNING_KEY_PASSWORD }}
        run: node scripts/sign-linux-artifacts.mjs release
      - id: artifact
        shell: bash
        run: |
          input="release/*.deb,release/*.AppImage"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            input="$input,release/*.deb.sig,release/*.AppImage.sig,release/linux-signing-public-key.pem"
          fi
          node scripts/prepare-artifact.mjs --target linux --input "$input" --signed "${{ steps.signing.outputs.signed }}" --why-not "LINUX_SIGNING_KEY not configured"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error

  desktop-win:
    name: windows NSIS and portable
    runs-on: windows-latest
    needs: web
    # Main pushes build and publish Windows together with Android and Linux.
    # Manual dispatches can still select Windows explicitly.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (contains(inputs.targets, 'all') || contains(inputs.targets, 'desktop-win') || contains(inputs.targets, 'windows')))
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - shell: bash
        run: if [ -n "${{ inputs.version_override }}" ]; then node scripts/version.mjs "${{ inputs.version_override }}"; fi
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          RELEASE_REQUIRES_SIGNING: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            if ($env:RELEASE_REQUIRES_SIGNING -eq 'true') {
              Write-Error 'Windows release signing requires WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD before publishing'
              exit 1
            }
            Write-Warning 'Windows signing skipped: WINDOWS_CERTIFICATE_BASE64 or WINDOWS_CERTIFICATE_PASSWORD is not configured'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Signing skipped'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'Windows: certificate secrets are absent, so NSIS and portable .exe artifacts are unsigned. Artifact name includes unsigned.'
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'yayra-windows-signing.pfx'
            $certificateBase64 = $env:WINDOWS_CERTIFICATE_BASE64 -replace '\s', ''
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($certificateBase64))
            # Build first without electron-builder's automatic signer. The
            # resulting release executables are signed explicitly below with
            # signtool so self-signed PFX certificates work consistently.
            "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_IDENTITY_AUTO_DISCOVERY=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - name: Inject Google sign-in config from repo secrets (optional)
        shell: bash
        env:
          YAYRA_GOOGLE_CLIENT_ID: ${{ secrets.YAYRA_GOOGLE_CLIENT_ID }}
          YAYRA_GOOGLE_CLIENT_SECRET: ${{ secrets.YAYRA_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$YAYRA_GOOGLE_CLIENT_ID" ] && [ -n "$YAYRA_GOOGLE_CLIENT_SECRET" ]; then
            node -e "require('fs').writeFileSync('electron/google-auth.config.json', JSON.stringify({ clientId: process.env.YAYRA_GOOGLE_CLIENT_ID.trim(), clientSecret: process.env.YAYRA_GOOGLE_CLIENT_SECRET.trim() }))"
            echo "Google sign-in config baked into this build."
          else
            echo "::warning:: YAYRA_GOOGLE_CLIENT_ID / YAYRA_GOOGLE_CLIENT_SECRET repo secrets not set - installed builds will show 'Google sign-in isn't configured' until users drop google-auth.config.json into their yayra config directory."
          fi
      - run: npm run package:win
      - name: Smoke packaged Windows shell and PDF.js worker
        run: npm run smoke:desktop
      - name: Sign Windows executables with the configured PFX
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -File -Filter 'signtool.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like '*\x64\signtool.exe' } |
            Sort-Object FullName |
            Select-Object -Last 1
          if ($null -eq $signTool) {
            Write-Error 'Windows SDK signtool.exe was not found on the runner'
            exit 1
          }
          $executables = @(Get-ChildItem -Path release -File -Filter '*.exe')
          if ($executables.Count -eq 0) {
            Write-Error 'no release executables were produced under release/'
            exit 1
          }
          foreach ($exe in $executables) {
            & $signTool.FullName sign /fd SHA256 /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD /d 'Yayra' $exe.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "signtool failed for $($exe.Name)"
              exit $LASTEXITCODE
            }
            $signature = Get-AuthenticodeSignature -FilePath $exe.FullName
            if ($null -eq $signature.SignerCertificate) {
              Write-Error "no Authenticode signer was found on $($exe.Name)"
              exit 1
            }
          }
      - name: Verify Windows executables
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -File -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Error 'no exe produced under release/'
            exit 1
          }
          node scripts/assert-windows-version.mjs $exe.FullName
      - id: artifact
        shell: bash
        run: node scripts/prepare-artifact.mjs --target windows --signed ${{ steps.signing.outputs.signed }} --why-not "WINDOWS_CERTIFICATE_BASE64 or WINDOWS_CERTIFICATE_PASSWORD not configured"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error

  android:
    name: android release APK
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (contains(inputs.targets, 'all') || contains(inputs.targets, 'android')))
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Capacitor 8's Android library compiles with Java 21
      # (sourceCompatibility 21); the runner's default JDK is older, which
      # fails Gradle with "error: invalid source release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: if [ -n "${{ inputs.version_override }}" ]; then node scripts/version.mjs "${{ inputs.version_override }}"; fi
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          RELEASE_REQUIRES_SIGNING: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            if [ "$RELEASE_REQUIRES_SIGNING" = "true" ]; then
              echo "::error:: Android release signing requires the keystore secrets before publishing"
              exit 1
            fi
            echo "::warning:: Android signing skipped: one or more Android keystore secrets are absent; release APK is unsigned"
            {
              echo "## Signing skipped"
              echo "Android: keystore secrets are absent, so the APK is unsigned. Artifact name includes unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-release.keystore
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android-release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_TYPE=${ANDROID_KEYSTORE_TYPE:-PKCS12}" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      # The Android build is the flakiest leg of the release (generated
      # platform + Kotlin + gradle + SDK toolchain). Raw CI logs are not
      # always reachable when debugging (API log redirects), so the build
      # output is tee'd and, on failure, the actionable gradle error lines
      # are re-emitted as ::error annotations - those ARE readable through
      # the checks/annotations API without log access.
      - name: build:android (captured)
        run: |
          set -o pipefail
          npm run build:android 2>&1 | tee /tmp/android-build.log
      - name: Report Android build failure diagnostics
        if: failure()
        run: |
          LOG=/tmp/android-build.log
          [ -f "$LOG" ] || { echo "::error::android build produced no captured log"; exit 0; }
          # Actionable lines: Kotlin compile errors (e:), javac errors,
          # gradle task failures, causes, and the FAILURE summary block.
          {
            grep -E "^e: |error: |^> Task .* FAILED|Execution failed for task|What went wrong|Caused by:|^FAILURE" "$LOG" | head -40
          } > /tmp/android-errors.txt || true
          {
            echo "### Android build failure diagnostics"
            echo '```'
            cat /tmp/android-errors.txt
            echo "--- last 60 lines ---"
            tail -n 60 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          i=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            i=$((i+1))
            echo "::error::${line}"
            [ "$i" -ge 12 ] && break
          done < /tmp/android-errors.txt
          exit 0
      - name: Verify Android release is actually signed
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          if find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit | grep -q .; then
            echo "::error:: Gradle produced an unsigned Android release APK despite signing secrets being configured"
            exit 1
          fi
      - id: artifact
        run: node scripts/prepare-artifact.mjs --target android --signed ${{ steps.signing.outputs.signed }} --why-not "Android keystore secrets not configured"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error

  ios:
    name: iOS archive/export
    runs-on: macos-14
    needs: web
    # Apple remains an explicit later-release option; do not block the
    # Android/Linux release on an Apple certificate or team.
    if: github.event_name == 'workflow_dispatch' && (contains(inputs.targets, 'all') || contains(inputs.targets, 'ios'))
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: if [ -n "${{ inputs.version_override }}" ]; then node scripts/version.mjs "${{ inputs.version_override }}"; fi
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - id: signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_CERTIFICATE_P12_BASE64" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "::warning:: iOS signing skipped: Apple Developer/App Store Connect secrets are incomplete; archive is unsigned"
            {
              echo "## Signing skipped"
              echo "iOS: Apple Developer/App Store Connect secrets are absent or incomplete, so the archive/export is unsigned. Artifact name includes unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: node scripts/ensure-capacitor-platform.mjs ios
      - run: npx cap sync ios
      - name: Install Apple signing credentials
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/yayra-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PATH="$RUNNER_TEMP/yayra-signing.p12"
          PRIVATE_KEY_DIR="$RUNNER_TEMP/private_keys"
          PRIVATE_KEY_PATH="$PRIVATE_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          python3 - "$P12_PATH" <<'PY'
          import base64, os, pathlib, sys
          value = os.environ["APPLE_CERTIFICATE_P12_BASE64"]
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(value))
          PY
          security import "$P12_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$PRIVATE_KEY_DIR"
          python3 - "$PRIVATE_KEY_PATH" <<'PY'
          import base64, os, pathlib, sys
          value = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].replace('\\n', '\n')
          if "BEGIN PRIVATE KEY" not in value:
              value = base64.b64decode(value).decode()
          pathlib.Path(sys.argv[1]).write_text(value)
          PY
          echo "APPLE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "APPLE_AUTH_KEY_PATH=$PRIVATE_KEY_PATH" >> "$GITHUB_ENV"
          cat > ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          </dict></plist>
          EOF
      - name: Build signed or unsigned archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic -allowProvisioningUpdates -authenticationKeyPath "$APPLE_AUTH_KEY_PATH" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" -archivePath build/yayra.xcarchive archive
            xcodebuild -exportArchive -archivePath build/yayra.xcarchive -exportPath build/ios-export -exportOptionsPlist ios/exportOptions.plist -allowProvisioningUpdates -authenticationKeyPath "$APPLE_AUTH_KEY_PATH" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO archive -archivePath build/yayra.xcarchive
          fi
      - id: artifact
        shell: bash
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            input="build/ios-export/*.ipa"
          else
            input="build/yayra.xcarchive"
          fi
          node scripts/prepare-artifact.mjs --target ios --input "$input" --signed "${{ steps.signing.outputs.signed }}" --why-not "Apple Developer/App Store Connect secrets not configured"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error

  publish:
    name: draft release, verify assets, publish live
    runs-on: ubuntu-latest
    needs: [web, cloudflare-pages, desktop-linux, desktop-win, android, ios]
    # Publish ONLY when every platform leg succeeded (or was legitimately
    # skipped for this dispatch's targets). The old condition checked only
    # web + cloudflare, so v1.0.39 published LIVE with the Android APK job
    # failed - a release missing an entire platform and failing its own
    # manifest contract. '!= failure' still allows workflow_dispatch runs
    # that intentionally target a subset (skipped jobs are not failures).
    if: always() && needs.web.result == 'success' && needs['cloudflare-pages'].result != 'failure' && needs.android.result != 'failure' && needs.ios.result != 'failure' && needs['desktop-linux'].result != 'failure' && needs['desktop-win'].result != 'failure' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: .artifacts
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - run: node scripts/ci-summary.mjs .artifacts
      - name: Refuse to publish unsigned artifacts
        run: node scripts/assert-release-signed.mjs .artifacts
      - name: Generate and stage the release update manifest
        run: |
          node scripts/generate-update-manifest.mjs dist/updates/manifest.json .artifacts
          cp dist/updates/manifest.json ".artifacts/updates-manifest-${{ needs.web.outputs.version }}.json"
      - name: Select release verification targets
        shell: bash
        run: |
          targets="pwa,linux,android"
          requested="${{ inputs.targets }}"
          if [[ "${{ github.event_name }}" == "push" || "$requested" == "all" || "$requested" == *"desktop-win"* || "$requested" == *"windows"* ]]; then
            targets="$targets,windows"
          fi
          echo "RELEASE_TARGETS=$targets" >> "$GITHUB_ENV"
      - name: Publish draft-first GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs "v${{ needs.web.outputs.version }}" .artifacts
      - name: Deploy final release manifest to Pages and API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "::warning:: Final Cloudflare manifest deployment skipped: configure the Cloudflare secrets"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch main --commit-dirty=true
          node scripts/deploy-cloudflare-worker.mjs
      - name: Verify live release and manifest contract
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_MANIFEST_URL: ${{ needs['cloudflare-pages'].outputs.manifest_url || format('https://github.com/{0}/releases/download/v{1}/updates-manifest-{1}.json', github.repository, needs.web.outputs.version) }}
        run: node scripts/release-verify.mjs "v${{ needs.web.outputs.version }}"
