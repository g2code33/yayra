name: Build-only CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web bundle and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Dependency security gates (docs/PRODUCTION_CONFIG.md §6):
      # runtime deps must be totally clean; the full tree (build tooling)
      # fails the PR at high/critical. Targeted `overrides` in package.json
      # are the fix mechanism - never `npm audit fix --force`.
      - name: Audit runtime dependencies (zero tolerance)
        run: npm audit --omit=dev
      - name: Audit full dependency tree (fail on high/critical)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - run: npm run verify:pwa
      - run: npm run verify:packaging
      - run: npm run verify:branding
      - uses: actions/upload-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error

  desktop-linux:
    name: linux deb and AppImage build-only
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - name: Report unsigned Linux build
        run: |
          echo "::warning:: Linux signing skipped: no Linux signing secret is configured for PR build-only artifacts"
          {
            echo "## Signing skipped"
            echo "Linux PR build-only artifacts are unsigned; release.yml records this in artifact names."
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run package:linux
      - run: npm run verify:packaging
      - name: Prepare Chromium sandbox helper for packaged diagnostic
        run: |
          test -f release/linux-unpacked/chrome-sandbox
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: Diagnose packaged Linux shell and PDF.js worker
        continue-on-error: true
        run: npm run smoke:desktop

  desktop-win:
    name: windows NSIS and portable build-only
    runs-on: windows-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - name: Report Windows signing status
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$WINDOWS_CERTIFICATE_BASE64" ]; then
            echo "::warning:: Windows signing skipped: WINDOWS_CERTIFICATE_BASE64 is not configured for PR build-only artifacts"
            {
              echo "## Signing skipped"
              echo "Windows PR build-only artifacts are unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run package:win
      - run: npm run verify:packaging
      - name: Diagnose packaged Windows shell and PDF.js worker
        continue-on-error: true
        run: npm run smoke:desktop
      - name: Verify Windows executables
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Recurse -File -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Error 'no exe produced under release/'
            exit 1
          }
          node scripts/assert-windows-version.mjs $exe.FullName

  android:
    name: android APK build-only
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Capacitor 8's Android library compiles with Java 21
      # (sourceCompatibility 21); the runner's default JDK is older, which
      # fails Gradle with "error: invalid source release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - name: Report Android signing status
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning:: Android signing skipped: ANDROID_KEYSTORE_BASE64 is not configured; assembleRelease uploads an unsigned APK"
            {
              echo "## Signing skipped"
              echo "Android PR build-only APK is unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Same capture + annotation diagnostics as the release workflow: raw
      # run logs are not always reachable when debugging, but ::error
      # annotations are readable through the checks/annotations API.
      - name: build:android (captured)
        run: |
          set -o pipefail
          npm run build:android 2>&1 | tee /tmp/android-build.log
      - name: Report Android build failure diagnostics
        if: failure()
        run: |
          LOG=/tmp/android-build.log
          [ -f "$LOG" ] || { echo "::error::android build produced no captured log"; exit 0; }
          {
            grep -E "^e: |error: |^> Task .* FAILED|Execution failed for task|What went wrong|Caused by:|^FAILURE" "$LOG" | head -40
          } > /tmp/android-errors.txt || true
          {
            echo "### Android build failure diagnostics"
            echo '```'
            cat /tmp/android-errors.txt
            echo "--- last 60 lines ---"
            tail -n 60 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          i=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            i=$((i+1))
            echo "::error::${line}"
            [ "$i" -ge 12 ] && break
          done < /tmp/android-errors.txt
          exit 0

  ios:
    name: iOS archive build-only
    runs-on: macos-14
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - name: Report Apple signing status
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ]; then
            echo "::warning:: iOS signing skipped: APPLE_TEAM_ID or APP_STORE_CONNECT_KEY_ID is not configured; CI performs an unsigned archive attempt"
            {
              echo "## Signing skipped"
              echo "iOS PR build-only archive is unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: node scripts/ensure-capacitor-platform.mjs ios
      - run: npx cap sync ios
      # Capacitor 8 generates an Xcode project backed by Swift Package Manager;
      # it does not generate the old CocoaPods App.xcworkspace.
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO archive -archivePath build/yayra.xcarchive
