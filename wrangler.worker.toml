# Standalone Cloudflare Worker for the update/API endpoint.
# Pages remains the frontend deployment; this Worker runs on the account's
# workers.dev subdomain so it does not require a separate DNS zone.
name = "yayra-updates-api"
main = "worker/update-worker.mjs"
compatibility_date = "2026-10-03"
workers_dev = true

[vars]
# Model for Yayra's managed AI (/api/ai) on the NVIDIA key pool.
# Change it here (or `wrangler deploy --var NVIDIA_MODEL:...`) and redeploy -
# no code changes needed. API keys are NEVER here: secrets only
# (NVIDIA_API_KEYS / NVIDIA_API_KEY_n via `wrangler secret put`).
NVIDIA_MODEL = "moonshotai/kimi-k3"
# Exact web OAuth callback origins. Add any custom Yayra web origin here and
# register its matching /auth/callback URI with the Google Web OAuth client.
GOOGLE_WEB_ALLOWED_ORIGINS = "https://yayra.pages.dev,http://localhost:4173"
